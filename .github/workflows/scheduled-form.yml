name: Scheduled 10 dummy form responses

on:
  # Poller tiap 5 menit. Jadwal pengisian sebenarnya disimpan di
  # data/schedule.json, jadi jadwal yang terlewat tetap dikirim (catch-up)
  # dan tidak hilang seperti pada cron per-jam.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      respondent:
        description: "Paksa kirim satu responden (R01-R10), kosongkan untuk mode jadwal"
        required: false
        default: ""
      dry_run:
        description: "Validasi payload tanpa mengirim"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scheduled-form
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Jalankan penjadwal
        env:
          RESPONDENT: ${{ inputs.respondent }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG_FORM_RESPONSE: "1"
        shell: bash
        run: |
          args=()
          if [ -n "$RESPONDENT" ]; then args+=("--force=$RESPONDENT"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=("--dry-run"); fi
          node run-schedule.js "${args[@]}"

      - name: Simpan respons Google untuk diagnosa
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: form-response-debug
          path: form-response-debug.html
          if-no-files-found: ignore

      - name: Simpan state jadwal
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Tidak ada perubahan state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: update jadwal & state pengisian"
          git push
