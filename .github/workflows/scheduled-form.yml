name: Scheduled 10 dummy form responses

on:
  # Cron hanya dipakai untuk menyambung job yang berjalan lama. Interval 5
  # menit tidak bisa diandalkan: GitHub hanya memicu 2 dari ~300 jadwal pada
  # repo ini, sehingga job dibuat hidup ~5,5 jam dan loop sendiri.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      respondent:
        description: "Paksa kirim satu responden (R01-R10), kosongkan untuk mode jadwal"
        required: false
        default: ""
      dry_run:
        description: "Validasi payload tanpa mengirim"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# Satu job berjalan, satu menunggu. GitHub membatalkan run pending yang lebih
# lama, jadi antrean tidak menumpuk.
concurrency:
  group: scheduled-form
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Form terdiri dari 5 halaman, jadi pengisian harus lewat browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Jalankan penjadwal
        env:
          RESPONDENT: ${{ inputs.respondent }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_RUNTIME_MS: "19800000"
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        shell: bash
        run: node watch-schedule.js
